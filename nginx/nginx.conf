# Cấu hình Rate Limit
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;

    # 1. FRONTEND: Phục vụ giao diện người dùng
    location / {
        root /usr/share/nginx/html;
        index home.html home.htm;
        try_files $uri $uri/ /home.html; # Hỗ trợ chuyển trang cho React/Vue/SPA
    }

    # 2. BACKEND API: Chỉ những request bắt đầu bằng /api mới gọi vào Node.js
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        
        # Lưu ý: Có dấu / ở cuối port 3000 để Nginx cắt bỏ chữ /api khi chuyển vào Node.js
        proxy_pass http://inventory-service:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }
}
