apiVersion: v1
kind: Secret
metadata:
  name: pc-secrets
  namespace: pc-store
type: Opaque
stringData:
  MONGO_ROOT_USER: "admin"
  MONGO_ROOT_PASSWORD: "adminPassword123"
  REDIS_PASSWORD: "redisPassword123"
  MEILI_KEY: "meiliMasterKey123456"
  JWT_SECRET: "mySecretTokenKeyForAuth123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pc-config
  namespace: pc-store
data:
  NODE_ENV: "production"
  PORT: "3000"
  MEILI_HOST: "http://meilisearch:7700"
  MONGO_URI: "mongodb://admin:adminPassword123@mongodb:27017/inventory_db?authSource=admin"
