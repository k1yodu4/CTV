apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: pc-store
  labels:
    app: inventory-service
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: inventory-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: pc-store
  labels:
    app: inventory-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      imagePullSecrets:
        - name: harbor-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - inventory-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: inventory-service
          # Thay bằng tên image trên Harbor của bạn (ví dụ: harbor.lab.local/pc-store/pc-inventory:latest)
          image: harbor.lab.local/thuctaptotnghiep/pc-inventory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: pc-config
          env:
            - name: MEILI_KEY
              valueFrom:
                secretKeyRef:
                  name: pc-secrets
                  key: MEILI_KEY
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
