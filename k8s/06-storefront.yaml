apiVersion: v1
kind: Service
metadata:
  name: storefront-service
  namespace: pc-store
  labels:
    app: storefront
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: pc-store
  labels:
    app: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      imagePullSecrets:
        - name: harbor-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - storefront
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: storefront
          # Thay bằng tên image trên Harbor của bạn (ví dụ: harbor.lab.local/pc-store/pc-storefront:latest)
          image: harbor.lab.local/thuctaptotnghiep/pc-storefront:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
