apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  volumeMode: Filesystem
  nfs:
    server: 10.253.1.139
    path: /data/mongodb
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: meilisearch-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  volumeMode: Filesystem
  nfs:
    server: 10.253.1.139
    path: /data/meilisearch