# Rate limiting: Đặt ở context http (bên ngoài block server)
limit_req_zone $binary_remote_addr zone=fe_limit:10m rate=20r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index home.html index.html;

    # Phục vụ Frontend
    location / {
        limit_req zone=fe_limit burst=30 nodelay;
        try_files $uri $uri/ /home.html;
    }

    # Reverse proxy cho Backend API
    location /api/ {
        proxy_pass http://inventory-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
