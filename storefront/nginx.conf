# Rate limiting chỉ áp dụng cho request động / HTML
limit_req_zone $binary_remote_addr zone=fe_limit:10m rate=50r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index home.html index.html;

    # 1. Phục vụ tài nguyên tĩnh (ảnh, css, js...) không áp dụng rate limit
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff|woff2|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 2. Phục vụ Frontend HTML
    location / {
        limit_req zone=fe_limit burst=100 nodelay;
        try_files $uri $uri/ /home.html;
    }

    # 3. Reverse proxy cho Backend API
    location /api/ {
        proxy_pass http://inventory-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}
